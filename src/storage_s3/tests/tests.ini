[app:main]
use = egg:documentservice
auth.file = %(here)s/auth.ini
pyramid.reload_templates = true
pyramid.debug_authorization = true
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.debug_templates = true
pyramid.default_locale_name = en
storage = s3
curve = secp384r1
s3.secret_key = secret_key
s3.bucket = test
s3.region = eu-central-1
s3.access_key = access_key


[server:main]
use = egg:gunicorn
host = 0.0.0.0
port = 6543
backend = gevent

# Begin logging configuration

[loggers]
keys = root, storage_s3

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_storage_s3]
level = DEBUG
handlers =
qualname = storage_s3

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s][%(threadName)s] %(message)s

# End logging configuration
